services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: design
      POSTGRES_PASSWORD: design
      POSTGRES_DB: design_intelligence
    ports:
      - "5432:5432"
    volumes:
      - design_pg_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.13.2
    ports:
      - "6333:6333"
    volumes:
      - design_qdrant_data:/qdrant/storage

volumes:
  design_pg_data:
  design_qdrant_data:
