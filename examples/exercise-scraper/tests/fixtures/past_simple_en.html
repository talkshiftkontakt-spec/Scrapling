<head><title>Past Simple Exercises</title></head>
<body>
<main>
  <h1>Past Simple Exercises</h1>
  <h2>Exercise 1: Fill in the blanks</h2>
  <ol>
    <li>She ___ (go) to school yesterday.</li>
    <li>They ___ (not/play) football last week.</li>
    <li>___ you ___ (watch) the movie?</li>
  </ol>
  <h3>Answer key</h3>
  <p>1. went 2. did not play 3. Did, watch</p>
</main>
</body>
