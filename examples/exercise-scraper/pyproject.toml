[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exercise-scraper"
version = "0.1.0"
description = "Search and scrape grammar exercises from the web (PL + EN) using Scrapling"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "BSD-3-Clause"}
authors = [{name = "Scrapling Contributors"}]
dependencies = [
    "scrapling[all]>=0.4.10",
    "typer>=0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
search = ["google-search-results>=2.4"]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.32.0"]
drive = ["google-api-python-client>=2.100.0", "google-auth>=2.23.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
exercise-scraper = "exercise_scraper.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["exercise_scraper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
